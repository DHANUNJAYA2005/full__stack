<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Educational Event Management using Spring MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-university"></i> Educational Event Management using Spring MVC</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/events">Browse Events</a></li>
                <li class="nav-item"><a class="nav-link" href="/student/my-events">My Events</a></li>
                <li class="nav-item"><a class="nav-link text-danger" href="/student/logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2>Welcome, <span th:text="${student.name}">Student</span>!</h2>
    <hr>
    
    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h1 class="display-4 text-primary"><i class="fas fa-calendar-check"></i> <span th:text="${registrationsCount}">0</span></h1>
                    <p class="lead">Events Registered</p>
                    <a href="/student/my-events" class="btn btn-outline-primary mt-3">View My Events</a>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h1 class="display-4 text-success"><i class="fas fa-search"></i></h1>
                    <p class="lead">Find New Events</p>
                    <a href="/events" class="btn btn-outline-success mt-3">Browse Events</a>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Profile Info</h5>
                    <p class="mb-1"><strong>Email:</strong> <span th:text="${student.email}"></span></p>
                    <p class="mb-1"><strong>Dept:</strong> <span th:text="${student.department}"></span></p>
                    <p class="mb-1"><strong>Roll No:</strong> <span th:text="${student.rollNumber}"></span></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
