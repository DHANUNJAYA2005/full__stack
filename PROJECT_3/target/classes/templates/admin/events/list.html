<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin/dashboard">Admin Panel</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link active" href="/admin/events">Manage Events</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin/events/stats">Statistics</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Events List</h2>
        <a href="/admin/events/add" class="btn btn-success"><i class="fas fa-plus"></i> Add New Event</a>
    </div>
    
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Date</th>
                    <th>Dept/Type</th>
                    <th>Capacity</th>
                    <th>Registrations</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="event : ${events}">
                    <td th:text="${event.id}"></td>
                    <td th:text="${event.title}"></td>
                    <td th:text="${event.eventDate}"></td>
                    <td>
                        <span class="badge bg-secondary" th:text="${event.department}"></span>
                        <span class="badge bg-info" th:text="${event.eventType}"></span>
                    </td>
                    <td th:text="${event.capacity}"></td>
                    <td>
                        <span th:text="${event.registeredCount}"></span>
                        <a th:href="@{'/admin/registrations/' + ${event.id}}" class="btn btn-sm btn-outline-info ms-2">View</a>
                    </td>
                    <td>
                        <a th:href="@{'/admin/events/edit/' + ${event.id}}" class="btn btn-sm btn-primary"><i class="fas fa-edit"></i></a>
                        <form th:action="@{'/admin/events/delete/' + ${event.id}}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')"><i class="fas fa-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${events.isEmpty()}">
                    <td colspan="7" class="text-center">No events found.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
