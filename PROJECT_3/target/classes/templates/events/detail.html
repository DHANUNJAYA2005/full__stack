<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Educational Event Management using Spring MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-university"></i> Educational Event Management using Spring MVC</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/events">Events</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="row">
        <div class="col-md-8">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h2 class="card-title text-primary" th:text="${event.title}">Event Title</h2>
                    <div class="mb-3">
                        <span class="badge bg-info" th:text="${event.eventType}">Type</span>
                        <span class="badge bg-secondary" th:text="${event.department}">Dept</span>
                    </div>
                    <p class="card-text" th:text="${event.description}">Description...</p>
                    <hr>
                    <div class="row text-muted">
                        <div class="col-md-6 mb-2">
                            <i class="fas fa-calendar-day"></i> <strong th:text="${event.eventDate}">Date</strong>
                        </div>
                        <div class="col-md-6 mb-2">
                            <i class="fas fa-clock"></i> <strong th:text="${event.time}">Time</strong>
                        </div>
                        <div class="col-md-6 mb-2">
                            <i class="fas fa-map-marker-alt"></i> <strong th:text="${event.venue}">Venue</strong>
                        </div>
                        <div class="col-md-6 mb-2">
                            <i class="fas fa-users"></i> Seats: <strong th:text="${event.capacity - event.registeredCount} + ' left'">Seats</strong>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Google Maps iframe -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-light">
                    <h5><i class="fas fa-map"></i> Location</h5>
                </div>
                <div class="card-body p-0">
                    <iframe width="100%" height="300" style="border:0;" loading="lazy" allowfullscreen
                        th:src="@{'https://maps.google.com/maps?q=' + ${event.venue} + '+University+Campus&t=&z=13&ie=UTF8&iwloc=&output=embed'}">
                    </iframe>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm border-primary">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Registration</h5>
                </div>
                <div class="card-body text-center" th:if="${session.loggedStudent == null}">
                    <p>You must be logged in to register for events.</p>
                    <a href="/student/login" class="btn btn-outline-primary mb-2 w-100">Login</a>
                    <a href="/student/register" class="btn btn-primary w-100">Create Account</a>
                </div>
                
                <div class="card-body" th:if="${session.loggedStudent != null}">
                    <div th:if="${event.registeredCount >= event.capacity}">
                        <div class="alert alert-warning mb-0">Sorry, this event is fully booked.</div>
                    </div>
                    <div th:if="${event.registeredCount < event.capacity}">
                        <p>Logged in as: <strong th:text="${session.loggedStudent.name}">Name</strong></p>
                        <form th:action="@{'/student/register-event/' + ${event.id}}" method="post">
                            <button type="submit" class="btn btn-success w-100 btn-lg">Confirm Registration</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
