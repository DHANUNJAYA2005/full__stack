<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Event Statistics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin/dashboard">Admin Panel</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/admin/events">Manage Events</a></li>
            <li class="nav-item"><a class="nav-link active" href="/admin/events/stats">Statistics</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <h2>Event Registration Statistics</h2>
    <hr>
    
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-light">
                    <h5>Registrations by Department</h5>
                </div>
                <div class="card-body">
                    <canvas id="deptChart"></canvas>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-light">
                    <h5>Events by Type</h5>
                </div>
                <div class="card-body">
                    <canvas id="typeChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row mt-4 mb-5">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-light">
                    <h5>Department Raw Data</h5>
                </div>
                <div class="card-body">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>Department</th>
                                <th>Total Registrations</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="stat : ${stats.departmentStats}">
                                <td th:text="${stat[0]}"></td>
                                <td th:text="${stat[1]}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    
    // Process Department Data
    var deptStats = /*[[${stats.departmentStats}]]*/ [];
    var deptLabels = deptStats.map(item => item[0] || 'Unknown');
    var deptData = deptStats.map(item => item[1]);

    var ctxDept = document.getElementById('deptChart').getContext('2d');
    new Chart(ctxDept, {
        type: 'bar',
        data: {
            labels: deptLabels,
            datasets: [{
                label: 'Registrations',
                data: deptData,
                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: { beginAtZero: true }
            }
        }
    });

    // Process Type Data
    var typeStats = /*[[${stats.typeStats}]]*/ [];
    var typeLabels = typeStats.map(item => item[0] || 'Unknown');
    var typeData = typeStats.map(item => item[1]);

    var ctxType = document.getElementById('typeChart').getContext('2d');
    new Chart(ctxType, {
        type: 'pie',
        data: {
            labels: typeLabels,
            datasets: [{
                data: typeData,
                backgroundColor: [
                    'rgba(255, 99, 132, 0.6)',
                    'rgba(54, 162, 235, 0.6)',
                    'rgba(255, 206, 86, 0.6)',
                    'rgba(75, 192, 192, 0.6)',
                    'rgba(153, 102, 255, 0.6)'
                ]
            }]
        }
    });
    
    /*]]>*/
</script>

</body>
</html>
