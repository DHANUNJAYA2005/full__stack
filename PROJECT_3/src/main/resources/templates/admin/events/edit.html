<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin/dashboard">Admin Panel</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/admin/events">Manage Events</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <h2>Edit Event</h2>
    <div class="card shadow-sm mt-3">
        <div class="card-body">
            <form th:action="@{'/admin/events/edit/' + ${event.id}}" th:object="${event}" method="post">
                <input type="hidden" th:field="*{id}" />
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Title *</label>
                        <input type="text" class="form-control" th:field="*{title}" required>
                        <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-danger"></span>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Image URL</label>
                        <input type="text" class="form-control" th:field="*{imageUrl}" placeholder="https://example.com/image.jpg">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label>Description</label>
                    <textarea class="form-control" th:field="*{description}" rows="3" maxlength="500"></textarea>
                </div>
                
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label>Department</label>
                        <input type="text" class="form-control" th:field="*{department}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label>Event Type</label>
                        <select class="form-select" th:field="*{eventType}">
                            <option value="WORKSHOP">Workshop</option>
                            <option value="SEMINAR">Seminar</option>
                            <option value="CULTURAL">Cultural</option>
                            <option value="SPORTS">Sports</option>
                            <option value="TECHNICAL">Technical</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label>Capacity *</label>
                        <input type="number" class="form-control" th:field="*{capacity}" required min="1">
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label>Date *</label>
                        <input type="date" class="form-control" th:field="*{eventDate}" required>
                        <span th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}" class="text-danger"></span>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label>Time</label>
                        <input type="time" class="form-control" th:field="*{time}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label>Venue</label>
                        <input type="text" class="form-control" th:field="*{venue}">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">Update Event</button>
                <a href="/admin/events" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
