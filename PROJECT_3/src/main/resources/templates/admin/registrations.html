<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Event Registrations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin/dashboard">Admin Panel</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/admin/events">Manage Events</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Registrations: <span th:text="${event.title}">Event</span></h2>
        <a href="/admin/events" class="btn btn-secondary">Back to Events</a>
    </div>
    
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Roll Number</th>
                            <th>Registered At</th>
                            <th>Rating</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="reg : ${registrations}">
                            <td th:text="${reg.student.id}"></td>
                            <td th:text="${reg.student.name}"></td>
                            <td th:text="${reg.student.email}"></td>
                            <td th:text="${reg.student.department}"></td>
                            <td th:text="${reg.student.rollNumber}"></td>
                            <td th:text="${#temporals.format(reg.registeredAt, 'yyyy-MM-dd HH:mm')}"></td>
                            <td>
                                <span th:if="${reg.rating != null}">
                                    <i class="fas fa-star text-warning" th:each="i : ${#numbers.sequence(1, reg.rating)}"></i>
                                </span>
                                <span th:if="${reg.rating == null}" class="text-muted">No rating</span>
                            </td>
                        </tr>
                        <tr th:if="${registrations.isEmpty()}">
                            <td colspan="7" class="text-center">No registrations for this event yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
