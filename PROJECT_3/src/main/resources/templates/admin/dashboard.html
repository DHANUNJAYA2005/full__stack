<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin/dashboard"><i class="fas fa-cogs"></i> Admin Panel</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/admin/events">Manage Events</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/events/stats">Statistics</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="/">View Site</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2>Admin Dashboard</h2>
    <hr>
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card text-center shadow-sm h-100">
                <div class="card-body">
                    <h1 class="display-3 text-primary"><i class="fas fa-calendar-alt"></i></h1>
                    <h3 class="mt-3">Manage Events</h3>
                    <p class="text-muted">Create, update, or delete campus events.</p>
                    <a href="/admin/events" class="btn btn-primary w-50">Go to Events</a>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card text-center shadow-sm h-100">
                <div class="card-body">
                    <h1 class="display-3 text-success"><i class="fas fa-chart-pie"></i></h1>
                    <h3 class="mt-3">View Statistics</h3>
                    <p class="text-muted">See registration trends and event analytics.</p>
                    <a href="/admin/events/stats" class="btn btn-success w-50">View Stats</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
