<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Educational Event Management using Spring MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-university"></i> Educational Event Management using Spring MVC</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/events">Events</a></li>
                <li class="nav-item" th:if="${session.loggedStudent == null}"><a class="nav-link" href="/student/login">Student Login</a></li>
                <li class="nav-item" th:if="${session.loggedStudent != null}"><a class="nav-link" href="/student/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Admin</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Upcoming Events</h2>
        <button id="toggleViewBtn" class="btn btn-outline-primary"><i class="fas fa-calendar-alt"></i> Calendar View</button>
    </div>

    <!-- Filter Bar -->
    <div class="card mb-4" id="filterBar">
        <div class="card-body">
            <form action="/events" method="GET" class="row g-3">
                <div class="col-md-3">
                    <input type="text" class="form-control" name="dept" placeholder="Department">
                </div>
                <div class="col-md-3">
                    <select class="form-select" name="type">
                        <option value="">All Types</option>
                        <option value="WORKSHOP">Workshop</option>
                        <option value="SEMINAR">Seminar</option>
                        <option value="CULTURAL">Cultural</option>
                        <option value="SPORTS">Sports</option>
                        <option value="TECHNICAL">Technical</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-primary">Filter</button>
                    <a href="/events" class="btn btn-secondary">Clear</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Grid View -->
    <div id="eventsGrid" class="row g-4">
        <div class="col-md-4" th:each="event : ${events}">
            <div class="card h-100 shadow-sm event-card">
                <img th:if="${event.imageUrl}" th:src="${event.imageUrl}" class="card-img-top" alt="Event Image" style="height: 200px; object-fit: cover;">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${event.title}">Event Title</h5>
                    <p class="text-muted small mb-2">
                        <i class="fas fa-calendar"></i> <span th:text="${event.eventDate}">Date</span> | 
                        <i class="fas fa-clock"></i> <span th:text="${event.time}">Time</span>
                    </p>
                    <p class="mb-2"><span class="badge bg-info" th:text="${event.eventType}">Type</span> 
                    <span class="badge bg-secondary" th:text="${event.department}">Dept</span></p>
                    <p class="card-text small"><i class="fas fa-map-marker-alt"></i> <span th:text="${event.venue}">Venue</span></p>
                    <p class="card-text small text-danger" th:if="${event.registeredCount >= event.capacity}">Full</p>
                    <p class="card-text small text-success" th:if="${event.registeredCount < event.capacity}">
                        Seats left: <span th:text="${event.capacity - event.registeredCount}"></span>
                    </p>
                    <div class="mt-auto">
                        <a th:href="@{'/events/detail/' + ${event.id}}" class="btn btn-primary w-100">View Details & Register</a>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${events == null || events.isEmpty()}" class="col-12 text-center py-5">
            <h4 class="text-muted">No upcoming events found.</h4>
        </div>
    </div>

    <!-- Calendar View -->
    <div id="calendarView" style="display: none;">
        <div id="calendar"></div>
    </div>

</div>

<!-- Chatbot UI -->
<div id="chatbot-container">
    <div id="chatbot-header">Ask us anything!</div>
    <div id="chatbot-messages"></div>
    <div id="chatbot-input">
        <input type="text" id="chatInput" placeholder="Type a message...">
        <button id="chatSendBtn"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
